# nginx reverse-proxy example for Docrot Scan API.
# TLS terminates here; the service binds 127.0.0.1:8087.
#
# Production deployment: https://codebyaurora.com/docrot-api/
# Adjust server_name and cert paths for your environment (certificates must
# be provisioned for whichever hostname you deploy under).

limit_req_zone $binary_remote_addr zone=docrot_scan:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=docrot_conn:10m;

upstream docrot_scan_api {
    server 127.0.0.1:8087;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME / redirect to HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Replace with the certificate paths for your hostname, e.g. via
    # certbot --nginx or manual issuance (e.g. codebyaurora.com).
    ssl_certificate     /etc/letsencrypt/live/YOUR_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_HOSTNAME/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Hard caps aligned with the service's own limits (docs/API.md):
    # requests are tiny JSON documents only.
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Responses can take up to the job limit (240s default) + margin.
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        limit_req zone=docrot_scan burst=10 nodelay;
        limit_conn docrot_conn 10;

        proxy_pass http://docrot_scan_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Do not buffer JSON responses; stream them as produced.
        proxy_buffering off;

        # nginx enforces client_max_body_size before the app sees the body;
        # answer its 413 with the app's documented JSON envelope so the
        # contract holds at the edge too (see docs/API.md, "Why no 502/504?").
        error_page 413 = @docrot_too_large;
    }

    location @docrot_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"request_too_large","message":"request body exceeds limit (DOCROT_MAX_REQUEST_BYTES)"}}\n';
    }

    # Slightly tighter zone for the paid endpoint.
    location = /v1/scan {
        limit_req zone=docrot_scan burst=5 nodelay;
        limit_conn docrot_conn 4;

        proxy_pass http://docrot_scan_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
}
